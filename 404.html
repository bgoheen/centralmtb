<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost on the Trail | St. Paul Central Mountain Bike Team</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
:root {
  --ink:         #0A0A0A;
  --ink-2:       #161616;
  --ink-3:       #242424;
  --bone:        #F5F5F5;
  --bone-dim:    #BABABA;
  --bone-low:    #707070;
  --line:        rgba(245,245,245,0.12);
  --line-strong: rgba(245,245,245,0.28);
  --acid:        #C2282D;
  --acid-dim:    #D63E43;
  --acid-deep:   #7A1A1D;
  --display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --body:    "Roboto", system-ui, -apple-system, sans-serif;
  --maxw:    1440px;
  --gutter:  clamp(16px, 4vw, 40px);
  --ease:    cubic-bezier(0.16, 1, 0.3, 1);
  --t-fast:  180ms;
  --t-med:   320ms;
  --t-slow:  520ms;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
body {
  background: var(--ink);
  color: var(--bone);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: 0; background: 0; color: inherit; }
::selection { background: var(--acid); color: var(--ink); }

.skip {
  position: absolute; left: -9999px; top: 0;
  background: var(--acid); color: var(--ink);
  padding: 12px 18px; font-weight: 700; z-index: 100;
}
.skip:focus { left: 12px; top: 12px; }

a:focus-visible, button:focus-visible {
  outline: 2px solid var(--acid); outline-offset: 3px; border-radius: 2px;
}

.grain {
  position: fixed; inset: 0; z-index: 99; pointer-events: none;
  opacity: 0.06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.85'/></svg>");
}

/* Nav */
.nav {
  position: sticky; top: 0; z-index: 50;
  background: rgba(10,10,10,0.82);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border-bottom: 1px solid var(--line);
}
.nav__inner {
  max-width: var(--maxw); margin: 0 auto;
  padding: 14px var(--gutter);
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.brand { display: inline-flex; align-items: center; line-height: 1; }
.brand img { height: 44px; width: auto; transition: transform var(--t-fast) var(--ease); }
.brand:hover img { transform: rotate(-3deg) scale(1.04); }
.nav__links { display: none; gap: 28px; align-items: center; }
@media (min-width: 960px) { .nav__links { display: inline-flex; } }
.nav__links a {
  font-family: var(--display); font-weight: 700; font-size: 16px;
  letter-spacing: 0.04em; text-transform: uppercase;
  color: var(--bone-dim); position: relative; padding: 4px 0;
  transition: color var(--t-fast) var(--ease);
}
.nav__links a::after {
  content: ""; position: absolute; left: 0; bottom: -2px;
  height: 2px; width: 0; background: var(--acid);
  transition: width var(--t-med) var(--ease);
}
.nav__links a:hover { color: var(--bone); }
.nav__links a:hover::after { width: 100%; }
.nav__cta { display: inline-flex; align-items: center; gap: 12px; }
.nav__cta .btn { display: none; }
@media (min-width: 720px) { .nav__cta .btn { display: inline-flex; } }
.nav__burger {
  display: inline-grid; place-items: center;
  width: 44px; height: 44px;
  border: 1px solid var(--line-strong); border-radius: 8px;
}
.nav__burger span { width: 18px; height: 2px; background: var(--bone); position: relative; }
.nav__burger span::before, .nav__burger span::after {
  content: ""; position: absolute; left: 0; width: 18px; height: 2px; background: var(--bone);
}
.nav__burger span::before { top: -6px; }
.nav__burger span::after  { top: 6px; }
@media (min-width: 960px) { .nav__burger { display: none; } }
.sheet {
  position: fixed; inset: 0; z-index: 60;
  background: var(--ink); padding: 80px var(--gutter) 40px;
  transform: translateY(-100%); transition: transform var(--t-slow) var(--ease);
  visibility: hidden;
}
.sheet[data-open="true"] { transform: translateY(0); visibility: visible; }
.sheet a {
  display: block; font-family: var(--display); font-weight: 800;
  font-size: clamp(36px, 9vw, 56px); letter-spacing: -0.01em; text-transform: uppercase;
  color: var(--bone); padding: 14px 0; border-bottom: 1px solid var(--line);
}
.sheet a:hover { color: var(--acid); }
.sheet__close {
  position: absolute; top: 22px; right: var(--gutter);
  width: 44px; height: 44px; border: 1px solid var(--line-strong); border-radius: 8px;
  display: grid; place-items: center;
  font-family: var(--display); font-weight: 800; font-size: 28px; color: var(--bone);
}

/* Buttons */
.btn {
  display: inline-flex; align-items: center; gap: 10px;
  font-family: var(--display); font-weight: 800; font-size: 17px;
  letter-spacing: 0.06em; text-transform: uppercase;
  padding: 14px 22px; border-radius: 8px; line-height: 1;
  transition: transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
              color var(--t-fast) var(--ease);
}
.btn--primary {
  background: var(--acid); color: var(--bone);
  box-shadow: 0 1px 0 rgba(0,0,0,0.2) inset, 0 12px 28px -16px rgba(194,40,45,0.55);
}
.btn--primary:hover { background: var(--acid-dim); transform: translateY(-2px); }
.btn--ghost {
  background: transparent; color: var(--bone); border: 1px solid var(--line-strong);
}
.btn--ghost:hover { background: var(--ink-2); border-color: var(--bone-dim); }
.btn--small { padding: 10px 16px; font-size: 14px; }
.btn .arrow { display: inline-block; transition: transform var(--t-med) var(--ease); }
.btn:hover .arrow { transform: translateX(4px); }

/* Footer */
.footer { background: var(--ink); padding: 56px var(--gutter) 32px; }
.footer__inner { max-width: var(--maxw); margin: 0 auto; display: grid; gap: 40px; }
@media (min-width: 720px) { .footer__inner { grid-template-columns: 2fr 1fr 1fr 1fr; } }
.footer__brand img { height: 72px; width: auto; margin-bottom: 16px; }
.footer__brand p { font-size: 13px; color: var(--bone-low); max-width: 36ch; line-height: 1.55; }
.footer__col h4 {
  font-family: var(--display); font-weight: 700; font-size: 13px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--bone-low); margin-bottom: 14px;
}
.footer__col ul { list-style: none; display: grid; gap: 8px; }
.footer__col a { color: var(--bone-dim); font-size: 15px; transition: color var(--t-fast) var(--ease); }
.footer__col a:hover { color: var(--bone); }
.footer__bottom {
  max-width: var(--maxw); margin: 40px auto 0;
  padding-top: 24px; border-top: 1px solid var(--line);
  display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between;
  font-size: 13px; color: var(--bone-low);
}
.footer__social { display: flex; gap: 14px; margin-top: 18px; align-items: center; }
.footer__social a {
  color: var(--bone-low);
  display: inline-flex; align-items: center; justify-content: center;
  width: 38px; height: 38px;
  border: 1px solid var(--line-strong); border-radius: 8px;
  transition: color var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease);
}
.footer__social a:hover { color: var(--bone); border-color: var(--acid); }
.footer__brand-link { display: inline-block; line-height: 0; }
.footer__brand-link img { transition: transform var(--t-fast) var(--ease); }
.footer__brand-link:hover img { transform: rotate(-3deg) scale(1.04); }
.footer-treeline {
  display: block; line-height: 0;
  background: #C2282D; margin-top: -2px;
}
.footer-treeline img { display: block; width: 100%; height: auto; }

/* 404 content */
.not-found {
  min-height: calc(100vh - 80px);
  display: flex; align-items: center; justify-content: center;
  padding: clamp(64px, 10vw, 120px) var(--gutter);
  text-align: center;
}
.not-found__inner { max-width: 640px; }
.not-found__code {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(120px, 20vw, 220px);
  line-height: 0.85; letter-spacing: -0.04em;
  color: var(--acid); display: block; margin-bottom: 8px;
}
.not-found__heading {
  font-family: var(--display); font-weight: 900;
  font-size: clamp(36px, 6vw, 72px);
  line-height: 0.95; letter-spacing: -0.02em; text-transform: uppercase;
  color: var(--bone); margin-bottom: 20px;
}
.not-found__heading em { font-style: normal; color: var(--acid); }
.not-found__body {
  font-size: clamp(15px, 2vw, 18px); color: var(--bone-low);
  line-height: 1.6; max-width: 42ch; margin: 0 auto 36px;
}
.not-found__actions {
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
}
  </style>
</head>
<body>

<a href="#main" class="skip">Skip to content</a>
<div class="grain" aria-hidden="true"></div>

<script src="/includes/header.js"></script>

<main id="main">
  <div class="not-found">
    <div class="not-found__inner">
      <span class="not-found__code">404</span>
      <h1 class="not-found__heading">Lost on the <em>trail.</em></h1>
      <p class="not-found__body">Looks like this page took a wrong turn. It may have moved, been removed, or never existed in the first place.</p>
      <div class="not-found__actions">
        <a href="/" class="btn btn--primary">Back to Home <span class="arrow" aria-hidden="true">&rarr;</span></a>
        <a href="/join" class="btn btn--ghost">Join the Team</a>
        <a href="/parent-guide" class="btn btn--ghost">Parent Guide</a>
      </div>
    </div>
  </div>
</main>

<script src="/includes/footer.js"></script>
</body>
</html>
