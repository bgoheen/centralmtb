<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Race Schedule | St. Paul Central Mountain Bike Team</title>
<meta name="description" content="Race times, call-ups and coaches for St. Paul Central riders this race weekend.">
<meta property="og:title" content="Race Schedule | St. Paul Central Mountain Bike Team">
<meta property="og:description" content="Race times, call-ups and coaches for St. Paul Central riders this race weekend.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://centralmtb.com/races/">
<link rel="icon" type="image/png" href="/images/logo-64.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFFFFF;
    --ink: #0A0A0A;
    --muted: #666666;
    --line: #C8C8C8;
    --head: #ECECEC;
    --red: #C2282D;
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Roboto', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.35; }

  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 48px; }
  .team { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .8rem; color: var(--red); margin: 0; }
  h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.4rem, 8vw, 3.4rem); line-height: 1; margin: 2px 0 4px; }
  .updated { color: var(--muted); font-size: .85rem; margin: 0; }

  h2 { font-family: var(--display); font-weight: 800; font-size: 1.9rem; margin: 28px 0 8px; text-transform: uppercase; letter-spacing: .03em; padding-left: 10px; border-left: 5px solid var(--red); line-height: 1; }

  .scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid var(--line); padding: 7px 10px; text-align: left; vertical-align: top; min-width: 140px; max-width: 220px; }
  tr:first-child > * { border-top: 0; }
  tr > *:first-child { border-left: 0; }
  tr > *:last-child { border-right: 0; }
  tr:last-child > * { border-bottom: 0; }

  th.row { position: sticky; left: 0; z-index: 1; background: var(--head); font-size: .8rem; font-weight: 700; min-width: 110px; max-width: 120px; letter-spacing: .02em; }
  thead th { background: var(--ink); color: #fff; border-color: #333; font-weight: 700; font-size: 1rem; }
  thead th .tag { display: block; font-weight: 500; font-style: italic; font-size: .82rem; color: #BABABA; }
  thead th.row { background: var(--ink); color: #fff; }
  .racers div { padding-left: 1em; text-indent: -1em; }
  .racers .grp { font-size: .78rem; font-weight: 700; color: var(--muted); margin-top: 6px; }
  .racers .grp:first-child { margin-top: 0; }
  .racers .num { color: var(--muted); white-space: nowrap; }
  .tbd { color: var(--muted); font-style: italic; }
  tr.start td { font-weight: 700; font-size: 1.05rem; color: var(--red); }

  .msg { margin-top: 28px; padding: 22px; border: 1px solid var(--line); border-radius: 10px; }
  .msg strong { display: block; font-family: var(--display); font-size: 1.6rem; }

  .swipe { display: none; color: var(--muted); font-size: .82rem; margin: -4px 0 6px; }
  @media (max-width: 700px) {
    th, td { min-width: 175px; }
    .swipe { display: block; }
  }
  @media print {
    .swipe { display: none !important; }
    .updated { display: none; }
    .scroll { overflow: visible; border: 0; }
    th.row { position: static; }
    h2 { break-after: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <p class="team">Central MTB</p>
  <h1 id="event">Race schedule</h1>
  <main id="main"><p class="updated">Loading the schedule…</p></main>
</div>

<script>
  /* ===== PASTE YOUR WEB APP LINK BETWEEN THE QUOTES (the long Google link ending in /exec) ===== */
  const RACE_APP = 'https://script.google.com/macros/s/AKfycbwzqoZWlFywf_pePn_ccLy3Uc3wj2aWl0NGHcBG5Dh8XdICpQwuiBVejMTgqPi4-X3wHw/exec';
  /* ============================================================================================ */
  const appReady = /^https:\/\/script\.google\.com\/.+\/exec$/.test(RACE_APP.trim());

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // Reads and saves through the Google web app. The page itself lives on centralmtb.com, so it scrolls like any normal page.
  function call(fn, ...args) {
    if (!appReady) return Promise.reject(new Error('The web app link hasn\'t been added to this page yet.'));
    const url = RACE_APP.trim();
    const req = fn === 'getData'
      ? fetch(url + '?api=data' + (args[0] ? '&event=' + encodeURIComponent(args[0]) : '') + '&t=' + Date.now(), { cache: 'no-store' })
      : fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fn === 'addCoach' ? 'add' : 'remove', key: args[0], id: args[1], name: args[2] }) });
    return req
      .then(r => { if (!r.ok) throw new Error('The schedule didn\'t load. Check your connection and try again.'); return r.json(); })
      .then(d => { if (d && d.error) throw new Error(d.error); return d; });
  }

  function refresh() {
    call('getData', eventKey).then(render).catch(err => {
      document.getElementById('main').innerHTML = '<p class="msg">Couldn\'t load the schedule: ' + esc(err.message || err) + '</p>';
    });
  }

  function render(d) {
    document.getElementById('event').textContent = d.event || 'Race schedule';
    document.title = (d.event ? d.event + ' ' : '') + 'race schedule';

    const main = document.getElementById('main');
    if (!d.races.length) {
      main.innerHTML = '<div class="msg"><strong>Schedule coming soon</strong>The race times aren\'t posted yet. Check back soon.</div>';
      return;
    }

    const days = [];
    d.races.forEach(r => { if (!days.includes(r.day)) days.push(r.day); });

    main.innerHTML = days.map(day => {
      const races = d.races.filter(r => r.day === day);
      const cells = fn => races.map(r => '<td>' + fn(r) + '</td>').join('');
      return '<h2>' + esc(day || 'Races') + '</h2>' + (races.length > 1 ? '<p class="swipe">Swipe the table to see all ' + races.length + ' races.</p>' : '') + '<div class="scroll"><table>' +
        '<thead><tr><th class="row">RACE</th>' + races.map(r =>
          '<th>' + esc(r.race) + '</th>').join('') + '</tr></thead><tbody>' +
        '<tr><th class="row">RACERS<br>(Call-up #)</th>' + cells(r => '<div class="racers">' + racers(r.racers) + '</div>') + '</tr>' +
        '<tr><th class="row">COACH(ES)</th>' + cells(r => r.coaches.length ? esc(r.coaches.join(' / ')) : '<span class="tbd">TBD</span>') + '</tr>' +
        '<tr><th class="row">WARMUP TIME</th>' + cells(r => esc(r.warmup)) + '</tr>' +
        '<tr><th class="row">CALL-UP TIME</th>' + cells(r => esc(r.callup)) + '</tr>' +
        '<tr class="start"><th class="row">RACE START TIME</th>' + cells(r => esc(r.start)) + '</tr>' +
        '</tbody></table></div>';
    }).join('');
  }

  function racers(list) {
    return list.map(line => {
      if (/:\s*$/.test(line)) return '<div class="grp">' + esc(line.replace(/:\s*$/, '')) + '</div>';
      const m = line.match(/^(.*?)\s*(\([^)]*\))\s*$/);
      return '<div>' + (m ? esc(m[1]) + ' <span class="num">' + esc(m[2]) + '</span>' : esc(line)) + '</div>';
    }).join('');
  }

  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });


  const embedded = false;
  function postHeight() {}
  const eventKey = new URLSearchParams(location.search).get('event') || '';
  refresh();
</script>
</body>
</html>
