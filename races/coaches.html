<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coach Race Signup | St. Paul Central Mountain Bike Team</title>
  <meta name="description" content="Coaches: sign up to help St. Paul Central riders at this weekend's races.">
  <meta property="og:title" content="Coach Race Signup | St. Paul Central Mountain Bike Team">
  <meta property="og:description" content="Coaches: sign up to help St. Paul Central riders at this weekend's races.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://centralmtb.com/races/coaches">
  <link rel="icon" type="image/png" href="/images/logo-64.png">
<style>
  html, body { margin: 0; padding: 0; background: #F5F5F5; }
  .race-frame { display: block; width: 100%; min-height: 100vh; border: 0; background: #F5F5F5; }
  .race-missing { max-width: 560px; margin: 60px auto; padding: 18px 20px; font: 16px/1.5 Roboto, system-ui, sans-serif; color: #666; background: #fff; border: 1px solid #D9D9D9; border-left: 4px solid #C2282D; border-radius: 10px; }
</style>
</head>
<body>
<div id="race-slot"></div>

<script>
  /* ===== PASTE YOUR WEB APP LINK BETWEEN THE QUOTES (the long Google link ending in /exec) ===== */
  const RACE_APP = 'https://script.google.com/macros/s/AKfycbwzqoZWlFywf_pePn_ccLy3Uc3wj2aWl0NGHcBG5Dh8XdICpQwuiBVejMTgqPi4-X3wHw/exec';
  /* ============================================================================================ */

  (function () {
    var slot = document.getElementById('race-slot');
    var url = RACE_APP.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      slot.innerHTML = '<div class="race-missing">The coach signup will show here once the web app link is pasted into this page.</div>';
      return;
    }
    var frame = document.createElement('iframe');
    frame.className = 'race-frame';
    frame.title = 'Coach Race Signup';
    frame.src = url + '?embed=1';
    slot.appendChild(frame);

    // The schedule reports its height so the frame grows to fit, with no scrollbar inside a scrollbar.
    window.addEventListener('message', function (e) {
      var d = e.data;
      if (!d || d.cmtbFrame !== 'signup' || !d.height) return;
      try { if (!/(^|\.)(google\.com|googleusercontent\.com)$/.test(new URL(e.origin).hostname)) return; } catch (err) { return; }
      frame.style.height = Math.max(d.height + 4, window.innerHeight) + 'px';
    });
  })();
</script>
</body>
</html>
