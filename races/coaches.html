<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Coach Race Signup | St. Paul Central Mountain Bike Team</title>
<meta name="description" content="Coaches: sign up to help St. Paul Central riders at this weekend's races.">
<meta property="og:title" content="Coach Race Signup | St. Paul Central Mountain Bike Team">
<meta property="og:description" content="Coaches: sign up to help St. Paul Central riders at this weekend's races.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://centralmtb.com/races/coaches">
<link rel="icon" type="image/png" href="/images/logo-64.png">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F5F5;
    --surface: #FFFFFF;
    --ink: #0A0A0A;
    --ink-2: #242424;
    --muted: #666666;
    --line: #D9D9D9;
    --grey-soft: #ECECEC;
    --red: #C2282D;
    --red-deep: #7A1A1D;
    --red-soft: #FBEAEA;
    --danger: #C2282D;
    --display: 'Barlow Condensed', 'Arial Narrow', system-ui, sans-serif;
    --body: 'Roboto', system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 16px; line-height: 1.45; }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid var(--red); outline-offset: 2px; }

  .wrap { max-width: 760px; margin: 0 auto; padding: 20px 16px 80px; }

  header .team { font-weight: 700; text-transform: uppercase; letter-spacing: .06em; font-size: .8rem; color: var(--red); margin: 0; }
  header h1 { font-family: var(--display); font-weight: 900; font-size: clamp(2.6rem, 9vw, 3.6rem); line-height: .95; margin: 2px 0 8px; letter-spacing: -.01em; }
  header .note { color: var(--muted); margin: 0 0 14px; max-width: 60ch; }
  .summary { margin: 0 0 14px; font-weight: 600; }
  .summary.needs { color: var(--red); }
  .summary.done { color: var(--ink); }

  .me { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0; border-bottom: 1px solid var(--line); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .me label { font-weight: 600; }
  .me input { flex: 1 1 180px; min-width: 0; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  .me .who { font-weight: 600; }
  .me .link { background: none; border: 0; padding: 4px; color: var(--red); text-decoration: underline; }
  .btn { border: 0; border-radius: 6px; padding: 10px 16px; background: var(--red); color: #fff; font-weight: 700; }
  .btn:hover:not(:disabled) { background: var(--red-deep); }
  .btn:disabled { background: #BABABA; cursor: not-allowed; }

  .day-title { font-family: var(--display); font-weight: 800; text-transform: uppercase; letter-spacing: .02em; font-size: 2rem; margin: 30px 0 0; padding-bottom: 4px; border-bottom: 3px solid var(--red); }
  .day-title span { text-transform: none; letter-spacing: 0; font-family: var(--body); font-weight: 500; font-size: .95rem; color: var(--muted); margin-left: 8px; }

  .wave { display: grid; grid-template-columns: minmax(132px, max-content) minmax(0, 1fr); gap: 16px; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .clock { border-left: 4px solid var(--ink); padding-left: 10px; }
  .wave.open .clock { border-left-color: var(--red); }
  .start { font-family: var(--display); font-weight: 800; font-size: 2.6rem; line-height: 1; }
  .start { white-space: nowrap; }
  .start .ap { font-size: 1rem; margin-left: 3px; }
  .start small { display: block; font-family: var(--body); font-weight: 500; font-size: .8rem; color: var(--muted); margin-top: 2px; }
  .sub { margin-top: 10px; font-size: .85rem; color: var(--muted); }
  .sub b { display: block; color: var(--ink); font-weight: 600; font-size: .95rem; white-space: nowrap; }

  .wave h2 { font-family: var(--display); font-weight: 700; font-size: 1.6rem; line-height: 1.1; margin: 0; }
  ul.racers { list-style: none; margin: 10px 0 14px; padding: 0; columns: 2 220px; column-gap: 20px; }
  ul.racers li { break-inside: avoid; padding: 1px 0; }
  ul.racers li.group { font-size: .8rem; font-weight: 600; color: var(--muted); padding-top: 6px; }
  ul.racers li.group:first-child { padding-top: 0; }
  .num { color: var(--muted); font-size: .88rem; white-space: nowrap; }

  .coaches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 10px; border-radius: 10px; background: var(--grey-soft); }
  .wave.open .coaches { background: var(--red-soft); }
  .coaches .lbl { font-weight: 600; margin-right: 4px; }
  .wave.open .coaches .lbl { color: var(--red); }
  .chip { display: inline-flex; align-items: center; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 99px; padding: 3px 4px 3px 12px; font-weight: 500; }
  .chip.mine { background: var(--ink); border-color: var(--ink); color: #fff; }
  .chip button { border: 0; background: none; width: 26px; height: 26px; border-radius: 99px; line-height: 1; font-size: 1.1rem; color: inherit; opacity: .7; }
  .chip button:hover { opacity: 1; background: rgba(0,0,0,.08); }
  .coaches .add { margin-left: auto; padding: 7px 14px; }

  .empty, .error { padding: 28px 0; color: var(--muted); }
  .closed { margin-top: 24px; padding: 22px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
  .closed strong { display: block; font-family: var(--display); font-size: 1.6rem; }
  .error { color: var(--danger); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 8px; max-width: calc(100% - 32px); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.show { opacity: 1; }
  .busy { opacity: .55; pointer-events: none; }

  @media (max-width: 480px) {
    .wave { grid-template-columns: minmax(84px, max-content) minmax(0, 1fr); gap: 12px; }
    .start { font-size: 1.9rem; }
    .start .ap { display: block; margin: 2px 0 0; font-size: .85rem; line-height: 1; }
    .sub b { font-size: .85rem; }
    .coaches .add { margin-left: 0; width: 100%; }
  }
  .embedded .me { position: static; }
  .embedded .toast { position: absolute; bottom: auto; }
  @media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="team">Central MTB coaches</p>
    <h1 id="event">Loading…</h1>
    <p class="summary" id="summary"></p>
  </header>

  <div class="me" id="me" hidden></div>
  <main id="list"><p class="empty">Loading the schedule…</p></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  /* ===== PASTE YOUR WEB APP LINK BETWEEN THE QUOTES (the long Google link ending in /exec) ===== */
  const RACE_APP = 'https://script.google.com/macros/s/AKfycbwzqoZWlFywf_pePn_ccLy3Uc3wj2aWl0NGHcBG5Dh8XdICpQwuiBVejMTgqPi4-X3wHw/exec';
  /* ============================================================================================ */
  const appReady = /^https:\/\/script\.google\.com\/.+\/exec$/.test(RACE_APP.trim());
  let data = null;
  let myName = load('coachName') || '';
  let editingName = !myName;

  function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function save(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
  function same(a, b) { return a.trim().toLowerCase() === b.trim().toLowerCase(); }

  // Reads and saves through the Google web app. The page itself lives on centralmtb.com, so it scrolls like any normal page.
  function call(fn, ...args) {
    if (!appReady) return Promise.reject(new Error('The web app link hasn\'t been added to this page yet.'));
    const url = RACE_APP.trim();
    const req = fn === 'getData'
      ? fetch(url + '?api=data' + (args[0] ? '&event=' + encodeURIComponent(args[0]) : '') + '&t=' + Date.now(), { cache: 'no-store' })
      : fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: fn === 'addCoach' ? 'add' : 'remove', key: args[0], id: args[1], name: args[2] }) });
    return req
      .then(r => { if (!r.ok) throw new Error('The schedule didn\'t load. Check your connection and try again.'); return r.json(); })
      .then(d => { if (d && d.error) throw new Error(d.error); return d; });
  }

  function refresh() {
    return call('getData', eventKey).then(d => { data = d; render(); })
      .catch(err => {
        if (!data) document.getElementById('list').innerHTML = '<p class="error">Couldn\'t load the schedule: ' + esc(err.message || err) + '</p>';
      });
  }

  /* ---------- rendering ---------- */
  function render() {
    document.getElementById('event').textContent = data.event || 'Race day';
    document.title = (data.event ? data.event + ' ' : '') + 'coach signup';

    const listEl = document.getElementById('list');
    const sumEl = document.getElementById('summary');

    if (!data.races.length) {
      document.getElementById('me').hidden = true;
      sumEl.textContent = '';
      listEl.innerHTML = '<div class="closed"><strong>No races posted yet</strong>Check back soon.</div>';
      return;
    }

    document.getElementById('me').hidden = false;
    renderMe();

    const need = data.races.filter(r => r.coaches.length === 0).length;
    sumEl.className = 'summary ' + (need ? 'needs' : 'done');
    sumEl.textContent = need ? need + (need === 1 ? ' race still needs a coach.' : ' races still need a coach.') : 'Every race has a coach. Thank you!';

    let html = '';
    let lastDay = null;
    data.races.forEach((r, idx) => {
      if (r.day !== lastDay) {
        const count = data.races.filter(x => x.day === r.day).length;
        html += '<h2 class="day-title">' + esc(r.day || 'Races') + '<span>' + count + (count === 1 ? ' race' : ' races') + '</span></h2>';
        lastDay = r.day;
      }
      html += raceHtml(r, idx);
    });
    listEl.innerHTML = html;
    postHeight();
  }

  function raceHtml(r, idx) {
    const open = r.coaches.length === 0;
    const signed = myName && r.coaches.some(c => same(c, myName));
    const racers = r.racers.map(line => {
      if (/:\s*$/.test(line)) return '<li class="group">' + esc(line.replace(/:\s*$/, '')) + '</li>';
      const m = line.match(/^(.*?)\s*(\([^)]*\))\s*$/);
      return m ? '<li>' + esc(m[1]) + ' <span class="num">' + esc(m[2]) + '</span></li>' : '<li>' + esc(line) + '</li>';
    }).join('');
    const chips = r.coaches.map(c =>
      '<span class="chip' + (myName && same(c, myName) ? ' mine' : '') + '">' + esc(c) +
      '<button data-remove="' + idx + '" data-name="' + esc(c) + '" aria-label="Remove ' + esc(c) + '">×</button></span>'
    ).join('');
    const sub = (r.warmup ? '<div>Warmup<b>' + esc(r.warmup) + '</b></div>' : '') +
                (r.callup ? '<div>Call-up<b>' + esc(r.callup) + '</b></div>' : '');

    return '<section class="wave' + (open ? ' open' : '') + '">' +
      '<div class="clock"><div class="start">' + bigTime(r.start) + '<small>Start</small></div><div class="sub">' + sub + '</div></div>' +
      '<div><h2>' + esc(r.race) + '</h2>' +
      (racers ? '<ul class="racers">' + racers + '</ul>' : '<div style="height:12px"></div>') +
      '<div class="coaches"><span class="lbl">' + (open ? 'Needs a coach' : 'Coaches') + '</span>' + chips +
      (signed ? '' : '<button class="btn add" data-add="' + idx + '"' + (myName ? '' : ' disabled title="Enter your name at the top first"') + '>Add me</button>') +
      '</div></div></section>';
  }

  function bigTime(t) {
    const m = String(t || '').match(/^(\d{1,2}:\d{2})\s*([AaPp][Mm])?/);
    if (!m) return esc(t || '?');
    return esc(m[1]) + (m[2] ? '<span class="ap">' + m[2].toUpperCase() + '</span>' : '');
  }

  function renderMe() {
    const el = document.getElementById('me');
    if (editingName) {
      el.innerHTML = '<label for="nm">Your name</label><input id="nm" autocomplete="given-name" placeholder="First name" maxlength="40" value="' + esc(myName) + '"><button class="btn" id="saveName">Save</button>';
    } else {
      el.innerHTML = '<span>Signing up as <span class="who">' + esc(myName) + '</span></span><button class="link" id="changeName">Change</button>';
    }
  }

  /* ---------- actions ---------- */
  let lastTapY = 80;
  function toast(msg) {
    const t = document.getElementById('toast');
    if (embedded) {
      // Inside an iframe the whole page is visible at once, so show the message where the coach tapped.
      t.style.top = Math.max(10, lastTapY - 52) + 'px';
    }
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2600);
  }

  function act(fn, r, name, done) {
    const list = document.getElementById('list');
    list.classList.add('busy');
    call(fn, data.key, r.id, name)
      .then(d => { data = d; render(); toast(done); })
      .catch(err => { toast(err.message || String(err)); refresh(); })
      .finally(() => list.classList.remove('busy'));
  }

  document.addEventListener('click', e => {
    const t = e.target.closest('button');
    if (!t) return;
    lastTapY = (t.closest('section') || t).getBoundingClientRect().top + window.scrollY;
    if (t.id === 'saveName') {
      const v = document.getElementById('nm').value.replace(/[,\/]+/g, ' ').replace(/\s+/g, ' ').trim();
      if (!v) { document.getElementById('nm').focus(); return; }
      myName = v; save('coachName', v); editingName = false; render();
    } else if (t.id === 'changeName') {
      editingName = true; renderMe(); document.getElementById('nm').focus();
    } else if (t.dataset.add !== undefined) {
      const r = data.races[+t.dataset.add];
      act('addCoach', r, myName, 'Added you to ' + r.race + ' at ' + r.start);
    } else if (t.dataset.remove !== undefined) {
      const r = data.races[+t.dataset.remove];
      const n = t.dataset.name;
      const mine = myName && same(n, myName);
      if (!mine && !confirm('Remove ' + n + ' from ' + r.race + '?')) return;
      act('removeCoach', r, n, (mine ? 'Removed you from ' : 'Removed ' + n + ' from ') + r.race);
    }
  });

  document.addEventListener('keydown', e => {
    if (e.key === 'Enter' && e.target.id === 'nm') document.getElementById('saveName').click();
  });

  // Pick up other coaches' signups every minute and whenever the page comes back into view.
  setInterval(() => { if (!document.hidden) refresh(); }, 60000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) refresh(); });


  const embedded = false;
  function postHeight() {}
  const eventKey = new URLSearchParams(location.search).get('event') || '';
  refresh();
</script>
</body>
</html>
