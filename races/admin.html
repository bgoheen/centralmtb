<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race Setup | St. Paul Central Mountain Bike Team</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/images/logo-64.png">
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #F5F5F5; overflow: hidden; }
  .race-frame { display: block; width: 100%; height: 100vh; height: 100dvh; border: 0; background: #F5F5F5; }
  .race-missing { max-width: 560px; margin: 60px auto; padding: 18px 20px; font: 16px/1.5 Roboto, system-ui, sans-serif; color: #666; background: #fff; border: 1px solid #D9D9D9; border-left: 4px solid #C2282D; border-radius: 10px; }
</style>
</head>
<body>
<div id="race-slot"></div>

<script>
  /* ===== PASTE YOUR WEB APP LINK BETWEEN THE QUOTES (the long Google link ending in /exec) ===== */
  const RACE_APP = 'https://script.google.com/macros/s/AKfycbwzqoZWlFywf_pePn_ccLy3Uc3wj2aWl0NGHcBG5Dh8XdICpQwuiBVejMTgqPi4-X3wHw/exec';
  /* ============================================================================================ */

  (function () {
    var slot = document.getElementById('race-slot');
    var url = RACE_APP.trim();
    if (!/^https:\/\/script\.google\.com\/.+\/exec$/.test(url)) {
      slot.innerHTML = '<div class="race-missing">The race setup page will show here once the web app link is pasted into this page.</div>';
      return;
    }
    var frame = document.createElement('iframe');
    frame.className = 'race-frame';
    frame.title = 'Race setup';
    frame.src = url + '?admin=1';
    frame.setAttribute('allow', 'clipboard-write');   // lets the Copy buttons work
    slot.appendChild(frame);
  })();
</script>
</body>
</html>
