<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Photos &amp; Media | St. Paul Central Mountain Bike Team</title>
  <meta name="description" content="Photos, videos, and media from the St. Paul Central Mountain Bike Team — race highlights, team season video, and more.">
  <link rel="canonical" href="https://centralmtb.com/media">
  <link rel="icon" type="image/png" href="/images/logo-64.png">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700&family=Barlow+Condensed:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head><body>
<script src="/includes/header.js"></script>
  <header class="page-header"><div class="container"><div class="breadcrumb"></div><h1>Photos &amp; Media</h1><p>Season highlights, race photos, and memories from the trails.</p></div></header>
  <section class="section"><div class="container"><div class="content" style="max-width:900px">

    <h2>2025 Season Video</h2>
    <div style="padding:56.25% 0 0 0;position:relative;margin-bottom:48px;border-radius:10px;overflow:hidden"><iframe src="https://player.vimeo.com/video/1136280285?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" style="position:absolute;top:0;left:0;width:100%;height:100%;" title="St. Paul Central MTB 2025"></iframe></div>
    <script src="https://player.vimeo.com/api/player.js"></script>

    <hr class="section-divider">

    <h2>2024 Season Slideshow</h2>
    <div id="pdf-viewer" style="border:1px solid lightgray;border-radius:10px;overflow:hidden;background:#1a1a1a;position:relative">
      <div id="pdf-toolbar" style="display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;background:#111;color:#fff;font-family:'Roboto',sans-serif;font-size:14px;user-select:none">
        <button class="pdf-btn" id="pdf-prev" aria-label="Previous page">&larr;</button>
        <span id="pdf-info" style="min-width:80px;text-align:center">Loading...</span>
        <button class="pdf-btn" id="pdf-next" aria-label="Next page">&rarr;</button>
        <button class="pdf-btn" id="pdf-fs" aria-label="Fullscreen" style="margin-left:8px;font-size:16px" title="Fullscreen">&#x26F6;</button>
      </div>
      <div id="pdf-canvas-wrap" style="display:flex;justify-content:center;align-items:center;min-height:460px;padding:12px;box-sizing:border-box;background:#000">
        <canvas id="pdf-canvas" style="max-width:100%;height:auto;display:block;border-radius:4px;box-shadow:0 2px 12px rgba(0,0,0,.4)"></canvas>
      </div>
    </div>
    <style>
      .pdf-btn{background:none;border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:6px 14px;cursor:pointer;font-size:14px;font-family:inherit;transition:border-color .2s,background .2s}
      .pdf-btn:hover{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.08)}
      #pdf-viewer:fullscreen,#pdf-viewer:-webkit-full-screen{border-radius:0;border:none}
      #pdf-viewer:fullscreen #pdf-canvas-wrap,#pdf-viewer:-webkit-full-screen #pdf-canvas-wrap{min-height:calc(100vh - 50px)}
    </style>
    <script type="module">
      import*as pdfjsLib from"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";
      pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";
      const url="/media/2024-slideshow.pdf";
      let pdfDoc=null,pageNum=1,rendering=false,pendingPage=null;
      const canvas=document.getElementById("pdf-canvas"),ctx=canvas.getContext("2d"),info=document.getElementById("pdf-info"),viewer=document.getElementById("pdf-viewer"),wrap=document.getElementById("pdf-canvas-wrap");
      function renderPage(num){
        rendering=true;
        pdfDoc.getPage(num).then(page=>{
          const maxW=wrap.clientWidth-24;
          const maxH=document.fullscreenElement?window.innerHeight-74:undefined;
          const vp=page.getViewport({scale:1});
          let scale=Math.min(maxW/vp.width,2);
          if(maxH)scale=Math.min(scale,maxH/vp.height);
          const viewport=page.getViewport({scale});
          canvas.width=viewport.width;canvas.height=viewport.height;
          page.render({canvasContext:ctx,viewport}).promise.then(()=>{
            rendering=false;
            if(pendingPage!==null){const p=pendingPage;pendingPage=null;renderPage(p);}
          });
        });
        info.textContent=num+" / "+pdfDoc.numPages;
      }
      function go(num){if(!pdfDoc||num<1||num>pdfDoc.numPages)return;pageNum=num;if(rendering){pendingPage=num;}else{renderPage(num);}}
      document.getElementById("pdf-prev").addEventListener("click",()=>go(pageNum-1));
      document.getElementById("pdf-next").addEventListener("click",()=>go(pageNum+1));
      wrap.addEventListener("click",e=>{if(e.target===canvas)go(pageNum+1);});
      document.addEventListener("keydown",e=>{if(e.key==="ArrowLeft")go(pageNum-1);if(e.key==="ArrowRight")go(pageNum+1);});
      document.getElementById("pdf-fs").addEventListener("click",()=>{
        if(document.fullscreenElement)document.exitFullscreen();
        else if(viewer.requestFullscreen)viewer.requestFullscreen();
        else if(viewer.webkitRequestFullscreen)viewer.webkitRequestFullscreen();
      });
      document.addEventListener("fullscreenchange",()=>{if(pdfDoc)renderPage(pageNum);});
      pdfjsLib.getDocument(url).promise.then(pdf=>{pdfDoc=pdf;renderPage(1);});
    </script>

  </div></div></section>
 <script src="/includes/footer.js"></script>
</body>
</html>
